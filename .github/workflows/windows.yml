name: Windows

on:
  pull_request:
  push:
    branches:
      - dev
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/submodules
      - name: Extract TinyGo version
        id: version
        shell: bash
        run: ./.github/workflows/tinygo-extract-version.sh | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-windows-build
      - name: make gen-device
        run: make -j3 gen-device
      - name: Test TinyGo
        shell: bash
        run: make test GOTESTFLAGS="-short"
      - name: Build TinyGo release tarball
        shell: bash
        run: make build/release -j4
      - name: Make release artifact
        shell: bash
        working-directory: build/release
        run: 7z -tzip a tinygo${{ steps.version.outputs.version }}.windows-amd64.zip tinygo
      - name: Publish release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tinygo${{ steps.version.outputs.version }}.windows-amd64.zip
          path: build/release/tinygo${{ steps.version.outputs.version }}.windows-amd64.zip
          archive: false

  smoke-test-windows:
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: MinoruSekine/setup-scoop@v4
      - name: Install Dependencies
        # Only PowerShell gets scoop's exit status, see https://github.com/ScoopInstaller/Scoop/issues/3936
        shell: pwsh
        run: |
          scoop config use_external_7zip true
          scoop install binaryen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Download TinyGo build
        uses: actions/download-artifact@v8
        with:
          name: tinygo${{ needs.build-windows.outputs.version }}.windows-amd64.zip
          path: build/
        # This build is already unzipped.
      - name: Smoke tests
        shell: bash
        run: make smoketest-quick TINYGO=$(PWD)/build/tinygo/bin/tinygo

  stdlib-test-windows:
    # Pull requests skip the stdlib tests to save Windows runners.
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Download TinyGo build
        uses: actions/download-artifact@v8
        with:
          name: tinygo${{ needs.build-windows.outputs.version }}.windows-amd64.zip
          path: build/
        # This build is already unzipped.
      - name: Test stdlib packages
        run: make tinygo-test TINYGO=$(PWD)/build/tinygo/bin/tinygo STDLIB_TEST_FLAGS="-shard=${{ matrix.shard }}"

  stdlib-wasi-test-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: MinoruSekine/setup-scoop@v4
      - name: Install Dependencies
        # Only PowerShell gets scoop's exit status, see https://github.com/ScoopInstaller/Scoop/issues/3936
        shell: pwsh
        run: |
          scoop config use_external_7zip true
          scoop install binaryen wasmtime@48.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Download TinyGo build
        uses: actions/download-artifact@v8
        with:
          name: tinygo${{ needs.build-windows.outputs.version }}.windows-amd64.zip
          path: build/
        # This build is already unzipped.
      - name: Test stdlib packages on wasip1
        run: make tinygo-test-wasip1-fast TINYGO=$(PWD)/build/tinygo/bin/tinygo STDLIB_TEST_FLAGS="-shard=${{ matrix.shard }}"
